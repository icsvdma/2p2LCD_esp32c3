; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; src/ には独立した複数のプログラムがあるため、環境ごとにビルド対象を切り替える。
;   RSSリーダー     : pio run -e rss_reader -t upload
;   ライブカメラ     : pio run -e live_camera -t upload
;   BLEモニター      : pio run -e ble_monitor -t upload
;   BLEセンサーノード : pio run -e ble_node -t upload   (センサー側の基板に書き込む)
;
; ビルド前に src/secrets.h.example を src/secrets.h にコピーして WiFi 情報を設定すること。

[platformio]
default_envs = rss_reader

; ---- 共通設定 ----
[env]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino

; パーティション設定 (プログラム領域を拡大)
board_build.partitions = huge_app.csv

; ライブラリ依存関係
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    bitbank2/JPEGDEC@^1.4.1

; LovyanGFX用ビルドフラグ - 日本語フォントを最小限に
build_flags =
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLGFX_USE_V1
    ; 日本語フォントは efont のみ使用 (サイズを制限)
    -DLGFX_EFONT_JA_MINCHO=0
    -DLGFX_EFONT_JA_GOTHIC=1
    ; フォントサイズを制限 (12と16のみ)
    -DEFONT_USED_SIZES="12,16"

; モニター設定
monitor_speed = 115200

; ---- RSSニュースリーダー ----
[env:rss_reader]
build_src_filter = +<main.cpp>

; ---- 国道ライブカメラ ----
[env:live_camera]
build_src_filter = +<livecamera.cpp>

; ---- BLE センサーモニター (BTHome v2 受信・カード表示) ----
[env:ble_monitor]
build_src_filter = +<ble_monitor.cpp>
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    ${env.build_flags}
    ; スキャン (observer) だけ使う
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

; ---- BLE センサーノード (BTHome v2 送信サンプル) ----
[env:ble_node]
build_src_filter = +<ble_sensor_node.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    ${env.build_flags}
    ; 広告 (broadcaster) だけ使う
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    ; ノード名を固定したい場合 (8文字程度まで)
    ; -DNODE_NAME=\"room1\"
